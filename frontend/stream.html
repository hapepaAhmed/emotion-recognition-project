<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Recognition - Live Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container stream-page">
        <h1>Live Emotion Detection</h1>
        <p id="model-label" class="subtitle">Loading model...</p>

        <div class="stream-container">
            <!-- Live video feed -->
            <video id="video" autoplay playsinline></video>
            <!-- Shows the captured still frame -->
            <img id="snapshot" style="display:none;" alt="Captured frame" />
            <!-- Hidden canvas used for capturing -->
            <canvas id="canvas" style="display:none;"></canvas>

            <!-- Overlay shown while predicting -->
            <div id="predicting-overlay" class="predicting-overlay" style="display:none;">
                <div class="spinner"></div>
                <span>Analyzing...</span>
            </div>
        </div>

        <!-- Result badge -->
        <div id="result" class="result-badge" style="display:none;"></div>

        <!-- Controls -->
        <div class="controls">
            <!-- Capture button — visible while camera is live -->
            <button id="capture-btn" class="capture-btn" onclick="captureAndPredict()" style="display:none;">
                📸 Capture & Predict
            </button>
            <!-- Start/Restart button — visible after prediction -->
            <button id="restart-btn" class="restart-btn" onclick="restartCamera()" style="display:none;">
                ▶ Start Again
            </button>
            <button class="back-btn" onclick="window.location.href='index.html'">← Back to Models</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
